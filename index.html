<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<meta name="description" content="ANG 中秋互動網頁入口：手機橫向後開啟 Canva 原站">
<title>花好・月圓｜ANG 橫向入口</title>
<style>
  :root{color-scheme:dark;--gold:#f1cf91;--ink:#070a12}
  *{box-sizing:border-box}
  html,body{margin:0;min-width:100%;min-height:100%;background:var(--ink);color:#fff}
  body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
  .shell{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(22px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));background:radial-gradient(ellipse at 50% 15%,#453018 0%,#12131a 38%,#06080f 84%);}
  .card{width:min(100%,480px);text-align:center;padding:36px 24px 28px;border-radius:26px;border:1px solid #edc88c55;background:linear-gradient(160deg,#ffffff14,#ffffff05);box-shadow:0 15px 65px #0009}
  .mark{font-size:clamp(62px,10vw,82px);color:var(--gold);line-height:1.1;display:block;margin-bottom:20px}
  h1{font-size:clamp(24px,5vw,30px);letter-spacing:.07em;margin:0 0 14px}
  p{margin:0;color:#e7e5e3;line-height:1.8;font-size:15px}
  .small{font-size:12px;opacity:.73;margin-top:12px}
  .actions{display:flex;flex-direction:column;gap:12px;margin:23px auto 0;max-width:350px}
  .action{border:1px solid transparent;display:flex;min-height:52px;align-items:center;justify-content:center;padding:12px 18px;border-radius:16px;text-decoration:none;cursor:pointer;font:700 16px/1.35 inherit;background:var(--gold);color:#261b0d}
  .action.secondary{background:#ffffff17;color:#fff;border:1px solid #ffffff37}
  .action:focus-visible{outline:3px solid white;outline-offset:3px}
  .busy .mark{animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.55}}
  .error{display:none;color:#f6d1ac;font-size:13px;margin-top:16px}
  .error.show{display:block}
  .hint{display:none}
  body.phone-portrait .hint{display:block}
  body.phone-portrait .go{display:none}
  body:not(.phone-portrait) .hint{display:none}
  body.phone-portrait .direct{display:flex}
  .noscript{padding:12px;text-align:center}
  @media(prefers-reduced-motion:reduce){.busy .mark{animation:none}}
</style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-label="ANG 中秋互動網頁入口">
      <span class="mark" aria-hidden="true">☾</span>
      <h1>花好・月圓</h1>
      <div class="hint" id="turnHint">
        <p>請將手機<strong>橫向</strong>，<br>就會直接開啟原本的 Canva 互動網站。</p>
        <p class="small">若無法旋轉，請關閉手機的直向鎖定。</p>
      </div>
      <div class="go" id="opening">
        <p>正在開啟 Canva 原站⋯</p>
        <p class="small">不再使用 iframe，避免「拒絕連線」訊息。</p>
      </div>
      <div class="actions">
        <a class="action" id="enter" href="https://angendenmf.my.canva.site/mfidea/">立即進入 Canva 原站</a>
        <a class="action secondary" href="https://idea.angsystem.com/midautumn/">開啟 ANG 原中秋互動版</a>
      </div>
      <p class="small">Canva 原站的影片、按鈕與內部跳頁由 Canva 提供。</p>
      <p class="error" id="redirectError" role="status">如果沒有自動開啟，請按「立即進入 Canva 原站」。</p>
    </section>
  </main>
  <noscript><div class="noscript">JavaScript 已關閉，請直接點選「立即進入 Canva 原站」。</div></noscript>
<script>
(function(){
  'use strict';
  const URL='https://angendenmf.my.canva.site/mfidea/';
  const ua=navigator.userAgent||'';
  const points=navigator.maxTouchPoints||0;
  const tablet=/iPad/i.test(ua)||(/Macintosh/i.test(ua)&&points>1)||(/Android/i.test(ua)&&!/Mobile/i.test(ua));
  const phone=!tablet&&(/iPhone|iPod|Android.*Mobile|Windows Phone/i.test(ua)||(points>0&&Math.min(screen.width||innerWidth,screen.height||innerHeight)<600));
  const enter=document.getElementById('enter');
  let navigating=false;
  function isPortrait(){return window.matchMedia('(orientation:portrait)').matches}
  function update(){
    const blocked=phone&&isPortrait();
    document.body.classList.toggle('phone-portrait',blocked);
    document.body.classList.toggle('busy',!blocked);
    if(!blocked&&!navigating){
      navigating=true;
      // Go straight to the Canva top-level URL; Canva does not allow embedding.
      window.location.replace(URL);
    }
  }
  enter.addEventListener('click',function(){navigating=true});
  window.addEventListener('resize',update,{passive:true});
  window.addEventListener('orientationchange',update,{passive:true});
  update();
})();
</script>
</body>
</html>
